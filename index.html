<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Chronicle AI – AI-Powered News Intelligence Platform</title>
    <meta name="description" content="Chronicle AI is an enterprise-grade AI news platform with real-time summarization, fake news detection, semantic search, multi-article comparison, personalized recommendations, and full ML transparency." />
    <meta name="keywords" content="AI news, fake news detection, news summarization, machine learning, personalized news, BERT, Gemini AI, semantic search" />
    <meta name="author" content="Chronicle AI" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chronicle.ai/" />
    <meta property="og:title" content="Chronicle AI – AI-Powered News Intelligence Platform" />
    <meta property="og:description" content="Enterprise AI news platform with real-time ML summarization, fake news detection, semantic search, and personalized recommendations powered by Gemini AI." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&h=630&fit=crop" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@chronicleai" />
    <meta name="twitter:title" content="Chronicle AI – AI-Powered News Intelligence" />
    <meta name="twitter:description" content="Enterprise AI news platform with real-time ML summarization, fake news detection, and personalized intelligence." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&h=630&fit=crop" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Chronicle AI",
      "description": "Enterprise AI-powered news intelligence platform",
      "url": "https://chronicle.ai",
      "applicationCategory": "NewsApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Theme color -->
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
